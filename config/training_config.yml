# Training Configuration

image_training:
  learning_rate: 1e-4
  optimizer: "Adam"
  loss_function: "BinaryCrossentropy"
  batch_size: 32
  epochs: 40
  validation_split: 0.2
  early_stopping_patience: 5
  early_stopping_metric: "val_loss"
  
  data_augmentation:
    random_flip: true
    random_rotation: 0.1
    random_zoom: 0.1
    random_brightness: 0.2
    random_contrast: 0.2
    jpeg_compression: true
    compression_quality_range: [50, 95]

video_training:
  learning_rate: 5e-5
  optimizer: "Adam"
  loss_function: "BinaryCrossentropy"
  batch_size: 8
  epochs: 25
  validation_split: 0.2
  early_stopping_patience: 3
  
  sequence_config:
    frame_sequence_length: 16
    frame_sampling_rate: 2  # Sample every 2nd frame
    
  data_augmentation:
    temporal_augmentation: true
    spatial_augmentation: true
    optical_flow: false  # Can enable for extra features

audio_training:
  learning_rate: 1e-4
  optimizer: "Adam"
  loss_function: "BinaryCrossentropy"
  batch_size: 64
  epochs: 30
  validation_split: 0.2
  early_stopping_patience: 5
  
  spectrogram_config:
    n_mels: 128
    n_fft: 2048
    hop_length: 512
    time_steps: 300  # ~10 seconds at target sample rate
    
  data_augmentation:
    spec_augment: true
    spec_augment_time_warp: true
    spec_augment_freq_mask: true
    spec_augment_time_mask: true

# Regularization
weight_decay: 1e-5
dropout_rate: 0.3
label_smoothing: 0.1

# Learning rate schedule
use_lr_scheduler: true
lr_schedule:
  type: "exponential_decay"  # or "reduce_on_plateau"
  decay_steps: 1000
  decay_rate: 0.96

# Class weights (if data imbalanced)
use_class_weights: true
class_weights:
  authentic: 1.0
  manipulated: 1.5  # Penalize false negatives more

